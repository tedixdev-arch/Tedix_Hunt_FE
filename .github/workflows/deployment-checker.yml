name: Deployment checker tests
on:
  pull_request:
    paths:
      - 'scripts/check-deployment*.mjs'
      - '.github/workflows/deployment-checker.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check-deployment*.mjs'
      - '.github/workflows/deployment-checker.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Test controlled responses; never probe the live prototype from CI.
      - run: node --test scripts/check-deployment.test.mjs
