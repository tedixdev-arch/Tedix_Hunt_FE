name: Frontend validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://tedixhunt-be-dev.anainfo.ai
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: npm test

  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: fe-dev-deploy
    env:
      DEPLOY_HOST: 62.238.112.85
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/Tedix_Hunt_FE/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate deployment version marker
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > public/version.json
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://tedixhunt-be-dev.anainfo.ai
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_FE }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync built site to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

  deploy-production:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: fe-production-deploy
    environment: production
    env:
      DEPLOY_HOST: 2.29.55.10
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/Tedix_Hunt_FE/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://tedixhunt-be-prod.anainfo.ai
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_FE_PRODUCTION }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync built site to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
