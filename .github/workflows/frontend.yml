name: Frontend validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://tedixhunt-be-dev.anainfo.ai
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: npm test

  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: fe-dev-deploy
    env:
      DEPLOY_HOST: 62.238.112.85
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/Tedix_Hunt_FE/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate deployment version marker
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > public/version.json
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://tedixhunt-be-dev.anainfo.ai
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_FE }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync built site to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Verify deployed dev build
        run: |
          remote_version="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$DEPLOY_PATH/version.json' && cat '$DEPLOY_PATH/version.json'")"
          printf '%s\n' "$remote_version"

          remote_commit="$(printf '%s' "$remote_version" | node -e \
            "let input = ''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const commit = JSON.parse(input).commit; if (typeof commit !== 'string') process.exit(1); process.stdout.write(commit); });")"
          test "$remote_commit" = "$GITHUB_SHA"
          echo "Verified deployed commit: $remote_commit"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "grep -R -F -q -- 'organizer/apply' '$DEPLOY_PATH/assets'"
          echo "Verified route marker: organizer/apply"
      - name: Verify public dev website
        env:
          PUBLIC_DEV_URL: https://tedixhunt-fe-dev.anainfo.ai
        run: |
          set -euo pipefail

          echo "Expected commit: $GITHUB_SHA"

          public_version_file="$(mktemp)"
          if ! curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            -o "$public_version_file" \
            "$PUBLIC_DEV_URL/version.json"; then
            echo "::error::Public version marker missing or stale."
            exit 1
          fi

          if ! public_commit="$(node -e \
            "const fs = require('fs'); const version = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (typeof version.commit !== 'string') process.exit(1); process.stdout.write(version.commit);" \
            "$public_version_file")"; then
            echo "::error::Public version marker missing or stale."
            exit 1
          fi

          echo "Public version.json commit: $public_commit"
          if [ "$public_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Public version marker missing or stale."
            exit 1
          fi

          public_index_file="$(mktemp)"
          public_bundle_file="$(mktemp)"
          if ! curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            -o "$public_index_file" \
            "$PUBLIC_DEV_URL/"; then
            echo "::error::Public site is serving a stale frontend bundle."
            exit 1
          fi

          if ! public_js_asset="$(node -e \
            "const fs = require('fs'); const html = fs.readFileSync(process.argv[1], 'utf8'); const match = html.match(/<script\\b[^>]*\\bsrc=[\"']([^\"']*\\/assets\\/index-[^\"']+\\.js(?:\\?[^\"']*)?)[\"']/i); if (!match) process.exit(1); process.stdout.write(match[1]);" \
            "$public_index_file")"; then
            echo "::error::Public site is serving a stale frontend bundle."
            exit 1
          fi

          public_js_url="$(node -e \
            "process.stdout.write(new URL(process.argv[1], process.argv[2] + '/').href)" \
            "$public_js_asset" "$PUBLIC_DEV_URL")"
          echo "Public JS asset: $public_js_asset"

          if ! curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            -o "$public_bundle_file" \
            "$public_js_url" || \
            ! grep -F -q -- 'organizer/apply' "$public_bundle_file"; then
            echo "::error::Public site is serving a stale frontend bundle."
            exit 1
          fi

          echo "Verified public route marker: organizer/apply"

  deploy-production:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: fe-production-deploy
    environment: production
    env:
      DEPLOY_HOST: 2.29.55.10
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/Tedix_Hunt_FE/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://tedixhunt-be-prod.anainfo.ai
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_FE_PRODUCTION }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync built site to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
